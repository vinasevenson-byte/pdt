    // Lê APENAS os nós permitidos ao produtor
    function loadProducerAllowedView() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const full = raw ? JSON.parse(raw) : FALLBACK_PRODUCER_NODES;
        return {
          config: full.config || FALLBACK_PRODUCER_NODES.config,
          produtora: (full.produtoras && full.produtoras[PRODUTORA_ID]) || FALLBACK_PRODUCER_NODES.produtoras.prod_exemplo,

          advanced: Object.fromEntries(

          ),

            Object.entries(full.antecipacoes || FALLBACK_PRODUCER_NODES.antecipacoes).filter(([, a]) => a.produtoraId === PRODUTORA_ID)
          ),

          repasses: Object.fromEntries(
            Object.entries(full.repasses || FALLBACK_PRODUCER_NODES.repasses).filter(([, r]) => r.produtoraId === PRODUTORA_ID)

      } catch (e) {
        return loadProducerAllowedView();

    function persistProducerWrite(mutatorFn) {
      const raw = localStorage.getItem(STORAGE_KEY);
      const full = raw ? JSON.parse(raw) : structuredClone(FALLBACK_PRODUCER_NODES);
      mutatorFn(full);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(full));

    function num(v) {
      const s = String(v == null ? '' : v).trim().replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      return isNaN(n) ? 0 : n;
    }
    function BRL(v) {
      return (v < -0.004 ? '− ' : '') + 'R$ ' + Math.abs(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function P(v) {
      return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
    }

    function stack(segs) {
      const tot = segs.reduce((t, g) => t + Math.max(0, g.v), 0) || 1;
      return segs.filter(g => g.v > 0.004).map(g => ({
        label: g.label,
        cor: g.cor,
        vTxt: BRL(g.v),
        pTxt: P((g.v / tot) * 100),
        f: (g.v / tot).toFixed(4)
      }));
    }
    function ariaOf(segs) {
      return segs.map(g => `${g.label} ${g.vTxt}`).join(', ');
    }
    function donut(segs, centerLabel, centerV) {
      const tot = segs.reduce((t, g) => t + Math.max(0, g.v), 0);
      let acc = 0;
      const parts = [];
      const out = segs.filter(g => g.v > 0.004).map(g => {
        const a = (acc / tot) * 100;
        const b = ((acc + g.v) / tot) * 100;
        const e = Math.max(a, b - 0.8);
        acc += g.v;
        parts.push(`${g.cor} ${a.toFixed(2)}% ${e.toFixed(2)}%`, `#ffffff ${e.toFixed(2)}% ${b.toFixed(2)}%`);
        return { label: g.label, cor: g.cor, vTxt: BRL(g.v), pTxt: P((g.v / tot) * 100) };
      });
      return {
        segs: out,
        aria: ariaOf(out),
        grad: `conic-gradient(${parts.length ? parts.join(', ') : '#eef1f7 0% 100%'})`,
        centerLabel,
        centerTxt: BRL(centerV)
      };
    }
    function wfBuild(steps) {
      steps = steps.filter(s => s.kind === 'start' || s.kind === 'total' || s.v > 0.004);
      let run = 0, max = 0;
      steps.forEach(s => {
        if (s.kind === 'start' || s.kind === 'total') run = s.v;
        else if (s.kind === 'dec') run -= s.v;
        else run += s.v;
        max = Math.max(max, run, s.v);
      });
      max = max || 1;
      run = 0;
      return steps.map(s => {
        const a = run;
        let b, x, w;
        if (s.kind === 'start' || s.kind === 'total') {
          b = s.v; x = 0; w = (Math.max(0, b) / max) * 100;
        } else if (s.kind === 'dec') {
          b = a - s.v; x = (Math.max(0, b) / max) * 100; w = ((Math.max(0, a) - Math.max(0, b)) / max) * 100;
        } else {
          b = a + s.v; x = (Math.max(0, a) / max) * 100; w = ((Math.max(0, b) - Math.max(0, a)) / max) * 100;
        }
        run = b;
        const big = s.kind === 'start' || s.kind === 'total';
        return {
          label: s.label,
          x: x.toFixed(2),
          w: Math.max(w, 0.8).toFixed(2),
          cor: s.cor,
          vTxt: s.kind === 'dec' ? BRL(-s.v) : s.kind === 'inc' ? '+ ' + BRL(s.v) : BRL(s.v),
          fw: big ? '800' : '600'
        };
      });
    }

    // Simulador "E se?" (What-If) exclusivo do Produtor operando APENAS sobre o bordero_produtor sanitizado
    function simularNoProdutor(bp, vendidosSimulados, metaLiberavel) {
      const cap = Math.max(1, Number(bp.capacidadeUsada || 1));
      const vendAtuais = Math.max(1, Number(bp.vendidosAtuais || Math.round((bp.pctVendido / 100) * cap) || 1));
      const borderoPorIngresso = Number(bp.borderoEvento || 0) / vendAtuais;
      const totRetAtuais = (bp.retencoes || []).filter(r => r.status === 'provisionado').reduce((t, r) => t + r.valor, 0);
      const totOps = (bp.descontosOperacionais || []).reduce((t, o) => t + o.valor, 0);
      const creditos = Number(bp.rebate || 0) + Number(bp.patrocinio || 0);
      const deducoesPos = Number(bp.jaRepassado || 0) + Number(bp.advEv || 0) + Number(bp.antEv || 0);
      const pctResA = Number(bp.pctResultadoRegra || 60);
      const modo = bp.modoRegra || 'MIN';
      const faixas = [...(bp.faixas || [])].sort((a, b) => a.gatilhoPct - b.gatilhoPct);

      function calcParaVendidos(vSim) {
        const vClamped = Math.max(0, Math.min(cap, Math.round(vSim)));
        const fator = vClamped / vendAtuais;
        const borderoSim = Math.round(borderoPorIngresso * vClamped * 100) / 100;
        // Projeção proporcional conservadora de retenções variáveis + fixas
        const retSim = vClamped >= vendAtuais ? Math.round(totRetAtuais * (0.5 + 0.5 * fator) * 100) / 100 : totRetAtuais;
        const resSim = Math.max(0, Math.round((borderoSim - Number(bp.despesas || 0) - retSim - totOps) * 100) / 100);
        const pctVend = (vClamped / cap) * 100;
        let fAtiva = null;
        for (const f of faixas) {
          if (pctVend >= f.gatilhoPct) fAtiva = f;
        }
        const libPctB = fAtiva ? fAtiva.liberaPct : 0;
        const valA = resSim * (pctResA / 100);

      window.state.checked = {};
      window.state.valor = '';
      window.state.ac1 = false;
      window.state.ac2 = false;
      window.state.enviado = false;
      window.render();
    };
    window.enviarSolicitacaoRepasse = () => {
      const PVIEW = loadProducerAllowedView();
      const consNode = PVIEW.borderos._consolidado || {};
      const eventoIds = Object.keys(window.state.checked).filter(id => window.state.checked[id] && PVIEW.borderos[id]?.liberavel > 0);
      const valorSolicitado = num(window.state.valor);
      const tarifaTed = consNode.tarifaTed !== undefined ? Number(consNode.tarifaTed) : Number((PVIEW.config.transferencia && PVIEW.config.transferencia.tedValor) ?? 10);
      const tarifaPix = consNode.tarifaPix !== undefined ? Number(consNode.tarifaPix) : Number((PVIEW.config.transferencia && PVIEW.config.transferencia.pixValor) ?? 0);
      const tarifaTransferencia = window.state.forma === 'TED' ? tarifaTed : tarifaPix;
      const valorLiquido = Math.max(0, valorSolicitado - tarifaTransferencia);
      persistProducerWrite(full => {
        if (!full.repasses) full.repasses = {};
        full.repasses['rep_' + Date.now()] = {
          produtoraId: PRODUTORA_ID,
          eventoIds,
          valorSolicitado,
          tarifaTransferencia,
          valorLiquido,
          forma: window.state.forma,
          contaId: window.state.contaSel,
          status: 'Solicitado',
          solicitadoEm: new Date().toLocaleDateString('pt-BR')
        };
      });
      window.state.valor = '';
      window.state.checked = {};
      window.state.ac1 = false;
      window.state.ac2 = false;
      window.state.enviado = true;
      window.render();
    };

    window.cadastrarContaProdutor = () => {
      const { banco, ag, cc, pix } = window.state.nc;
      persistProducerWrite(full => {
        if (!full.contas) full.contas = {};
        if (!full.contas[PRODUTORA_ID]) full.contas[PRODUTORA_ID] = {};
        full.contas[PRODUTORA_ID]['c_' + Date.now()] = {
          banco, agencia: ag, conta: cc, pix: pix || '—',
          titular: 'Produtora Exemplo Curitiba Ltda',
          status: 'Pendente',
          padrao: false
        };
      });
      window.state.nc = { banco: '', ag: '', cc: '', pix: '' };
      window.render();
    };

    window.pedirAntecipacaoProdutor = () => {
      const valor = num(window.state.antValor);
      persistProducerWrite(full => {
        if (!full.antecipacoes) full.antecipacoes = {};
        full.antecipacoes['ant_' + Date.now()] = {
          produtoraId: PRODUTORA_ID,
          eventoId: window.state.antEv,
          data: new Date().toLocaleDateString('pt-BR'),
          valor,
          taxaPct: 2,
          abaterNoProximo: true,
          status: 'Solicitada'
        };
      });
      window.state.antValor = '';
      window.state.antOk = true;
      window.render();
    };

    window.exportarCSV = () => {
      const PVIEW = loadProducerAllowedView();
      const rows = [['Evento', 'Data', '% Vendido', 'Bordero Evento', 'Despesas', 'Resultado', 'Liberavel', 'Retido']];
      Object.keys(PVIEW.eventos).forEach(id => {
        const ev = PVIEW.eventos[id];
        const bp = PVIEW.borderos[id];
        if (!bp) return;
        rows.push([
          `"${ev.nome}"`, ev.data, bp.pctVendido.toFixed(1),
          bp.borderoEvento.toFixed(2), bp.despesas.toFixed(2),
          bp.resultado.toFixed(2), bp.liberavel.toFixed(2), bp.retido.toFixed(2)
        ]);
      });
      const csv = 'data:text/csv;charset=utf-8,\uFEFF' + rows.map(r => r.join(';')).join('\n');
      const a = document.createElement('a');
      a.href = encodeURI(csv);
      a.download = 'extrato_produtor_diskingressos.csv';
      document.body.appendChild(a);
      a.click();
      a.remove();
      window.state.exportMsg = true;
      window.render();
    };

    // Tooltip listener
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('[data-tip]');
      const tip = document.getElementById('chart-tip');
      if (el && tip) { tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; }
    });
    document.addEventListener('mousemove', e => {
      const tip = document.getElementById('chart-tip');
      if (tip && tip.style.display === 'block') {
        tip.style.left = Math.min(window.innerWidth - 260, e.clientX + 12) + 'px';
        tip.style.top = Math.max(10, e.clientY - 36) + 'px';
      }
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('[data-tip]')) document.getElementById('chart-tip').style.display = 'none';
    });

    window.render();
  </script>
</body>
</html>
