      --border: #dde2ee;
      --input-border: #c9cfdf;
      --text: #0f1b3d;
      --text-mid: #3d4766;
      --text-sub: #5a6584;

      --c-liberavel: #0f8a5f;

      --c-pago: #2f55c4;

    * { box-sizing: border-box; margin: 0; padding: 0; }

      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--blue); text-decoration: none; }
    a:hover { color: var(--blue-hover); }

    .num { font-family: 'IBM Plex Mono', monospace; font-weight: 600; }
    .in {
      font: 500 15px 'IBM Plex Mono', monospace;
      color: var(--text);
      background: #fff;
      border: 1px solid var(--input-border);
      border-radius: 10px;
      padding: 10px 13px;
      min-height: 44px;
      width: 100%;
    }
    .in.tx { font-family: 'Manrope', sans-serif; font-weight: 600; }
    .in:focus { outline: 2px solid var(--blue); outline-offset: 1px; border-color: var(--blue); }

    .lb {
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-mid);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .h2 { margin: 0; font-size: 17px; font-weight: 800; color: var(--text); }
    .sub { font-size: 13px; color: var(--text-sub); line-height: 1.45; }
    .grp { font-size: 12px; font-weight: 800; color: var(--text-mid); letter-spacing: 0.08em; text-transform: uppercase; }

    .row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      font-size: 14px;
      color: var(--text-mid);
      padding: 5px 0;
    }

    .pill {
      border: 1px solid var(--input-border);
      background: #fff;
      color: var(--text);
      border-radius: 10px;
      padding: 10px 16px;
      min-height: 44px;
      font: 700 14px 'Manrope', sans-serif;
      cursor: pointer;
    }
    .pillOn {
      border: 2px solid var(--blue);
      background: #eef2ff;
      color: var(--blue);
      border-radius: 10px;
      padding: 10px 16px;
      min-height: 44px;
      font: 800 14px 'Manrope', sans-serif;
      cursor: pointer;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 18px;
      min-height: 44px;
      font: 800 14px 'Manrope', sans-serif;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn:disabled { background: var(--input-border); color: var(--text-sub); cursor: not-allowed; }
    .btn-primary { background: var(--blue); color: #fff; }
    .btn-orange { background: var(--orange); color: #fff; }
    .btn-green { background: #047857; color: #fff; }
    .btn-outline { background: #fff; color: var(--blue); border: 1px solid var(--blue); }
    .btn-soft { background: #eef2ff; color: var(--blue); }
    .btn-danger { background: #fee2e2; color: #991b1b; }
    .btn-sm { min-height: 34px; padding: 6px 12px; font-size: 12px; border-radius: 8px; }

    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(215px, 1fr));
      gap: 14px;
    }
    .kpi {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .kpi span:first-child {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .mods {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .mod {
      display: flex;
      gap: 18px;
      align-items: flex-start;
      text-align: left;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      min-height: 144px;
      cursor: pointer;
      font-family: 'Manrope', sans-serif;
      width: 100%;
      transition: all 0.15s ease;
    }
    .mod:hover {
      border-color: var(--blue);
      box-shadow: 0 6px 18px rgba(15, 27, 61, 0.08);
      transform: translateY(-1px);
    }

      width: 52px;
      height: 52px;
      border-radius: 12px;
      background: #e6ecfb;
      display: flex;
      align-items: center;
      justify-content: center;
      flex: none;
      color: var(--blue);
      font-size: 22px;

    .mtd { display: block; font-size: 13.5px; color: #4b5573; line-height: 1.45; }

      display: inline-block;
      margin-top: 10px;
      font-size: 12px;
      font-weight: 800;
      padding: 4px 10px;
      border-radius: 999px;
      background: #dcfce7;
      color: #065f46;

    .bdg.warn { background: #ffedd5; color: #9a3412; }
    .bdg.info { background: #eef2ff; color: var(--blue); }

      border-bottom: 3px solid transparent;
      background: transparent;
      color: var(--text-mid);
      padding: 14px 14px;
      min-height: 48px;
      font: 700 13.5px 'Manrope', sans-serif;
      cursor: pointer;
      white-space: nowrap;

    .tabOn {

      background: transparent;
      color: var(--text);
      padding: 14px 14px;
      min-height: 48px;
      font: 800 13.5px 'Manrope', sans-serif;
      cursor: pointer;
      white-space: nowrap;

    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left;
      font-size: 11.5px;
      font-weight: 800;
      color: var(--text-sub);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 10px 8px;
      border-bottom: 1px solid var(--border);
    }
    td {

      border-bottom: 1px solid #eef1f7;
      vertical-align: middle;
    }

    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }

      padding: 12px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;

    .alert-warn { background: #ffedd5; color: #9a3412; border: 1px solid #fed7aa; }
    .alert-info { background: #eef2ff; color: var(--blue); border: 1px solid #c7d2fe; }
    .alert-ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }

      pointer-events: none;
      z-index: 9999;
      background: #0f1b3d;
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      font-weight: 600;

      background: rgba(15, 27, 61, 0.55);

      display: none;
      align-items: center;
      justify-content: center;

    .modal-card {

        background: #fff !important;
        padding: 0 !important;
        display: block !important;
      }
      .modal-card {
        max-width: 100% !important;
        max-height: none !important;
        border: 0 !important;
        box-shadow: none !important;
        padding: 0 !important;
      }
      .no-print { display: none !important; }
    }

    function BRL(v) {
      const n = Number(v || 0);
      return (n < -0.004 ? '− ' : '') + 'R$ ' + Math.abs(n).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }
    function P(v) {
      return Number(v || 0).toLocaleString('pt-BR', { maximumFractionDigits: 1 }) + '%';
    }
    function num(v) {
      if (typeof v === 'number') return Number.isFinite(v) ? v : 0;
      const s = String(v == null ? '' : v).trim().replace(/\./g, '').replace(',', '.');
      const n = parseFloat(s);
      return Number.isFinite(n) ? n : 0;
    }

    function loadDB() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        const db = raw ? JSON.parse(raw) : structuredClone(SEED_DB);
        if (!db.config) db.config = {};
        if (!db.config.transferencia) db.config.transferencia = { pixValor: 0, tedValor: 10 };
        if (!db.auditoria) db.auditoria = structuredClone(SEED_DB.auditoria);
        recomputeAllBorderosProdutor(db);
        return db;
      } catch (e) {
        const db = structuredClone(SEED_DB);
        recomputeAllBorderosProdutor(db);
        return db;

    }

    // Espelha a Cloud Function recalcularEvento gravando /borderos_produtor sem nenhum campo de taxa
    function recomputeAllBorderosProdutor(db) {
      if (!db.borderos_produtor) db.borderos_produtor = {};
      const { calcEvento, calcConsolidado, bordero_produtor } = window.MotorRepasse;
      const cfgTransf = (db.config && db.config.transferencia) || { pixValor: 0, tedValor: 10 };

      for (const [prodId, prod] of Object.entries(db.produtoras || {})) {
        if (!db.borderos_produtor[prodId]) db.borderos_produtor[prodId] = {};
        const evCalculados = [];
        const advList = Object.entries(db.advanced || {}).map(([id, a]) => ({ id, ...a })).filter(a => a.produtoraId === prodId);
        const antList = Object.entries(db.antecipacoes || {}).map(([id, a]) => ({ id, ...a })).filter(a => a.produtoraId === prodId);
        const despList = Object.values(db.despesas || {}).filter(d => d.produtoraId === prodId);

        for (const [evId, evData] of Object.entries(db.eventos || {})) {
          if (evData.produtoraId !== prodId) continue;
          const ev = { id: evId, ...evData };
          const fin = (db.eventos_fin && db.eventos_fin[evId]) || {};
          const neg = (db.negociacoes && db.negociacoes[evId]) || {};
          const loc = (db.locais && db.locais[ev.localId]) || {};
          const despEv = despList.filter(d => d.eventoId === evId);
          const advEv = advList.filter(a => a.escopo === evId);
          const antEv = antList.filter(a => a.eventoId === evId);

          const calc = calcEvento(ev, fin, neg, despEv, advEv, antEv, loc);
          db.borderos_produtor[prodId][evId] = bordero_produtor(calc);
          evCalculados.push({ id: evId, nome: ev.nome, liberadoParaSolicitacao: ev.liberadoParaSolicitacao, ...calc });
        }

        const cons = calcConsolidado(prod, evCalculados, advList);
        db.borderos_produtor[prodId]._consolidado = {
          liberavelEventos: cons.liberavelEventos,
          patrocinioProdutora: cons.patrocinioProdutora,
          patrocinioDescricao: (prod.patrocinio && prod.patrocinio.descricao) || 'Patrocínio da produtora',
          advConsolidado: cons.advConsolidado,
          devedores: cons.devedores,
          saldoDisponivel: cons.saldoDisponivel,
          tarifaPix: Number(cfgTransf.pixValor || 0),
          tarifaTed: Number(cfgTransf.tedValor !== undefined ? cfgTransf.tedValor : 10)
        };
      }
    }

    // Gráficos acessíveis sem biblioteca externa (PROMPT 6)
    function buildDonut(segs, centerLabel, centerV) {
      const valid = segs.filter(g => g.v > 0.004);
      const tot = valid.reduce((t, g) => t + g.v, 0) || 1;
      let acc = 0;
      const parts = [];
      const out = valid.map(g => {
        const a = (acc / tot) * 100;
        const b = ((acc + g.v) / tot) * 100;
        const e = Math.max(a, b - 0.8); // ~2px de separação branca entre fatias
        acc += g.v;
        parts.push(`${g.cor} ${a.toFixed(2)}% ${e.toFixed(2)}%`, `#ffffff ${e.toFixed(2)}% ${b.toFixed(2)}%`);
        return { label: g.label, cor: g.cor, vTxt: BRL(g.v), pTxt: P((g.v / tot) * 100) };
      });
      const aria = out.map(g => `${g.label} ${g.vTxt} (${g.pTxt})`).join(', ');
      const grad = `conic-gradient(${parts.length ? parts.join(', ') : '#eef1f7 0% 100%'})`;

      return `
        <div style="display:flex;flex-wrap:wrap;align-items:center;gap:28px">
          <div role="img" aria-label="Gráfico de rosca: ${aria}" style="position:relative;width:176px;height:176px;flex:none;border-radius:50%;background:${grad}">
            <div style="position:absolute;inset:22px;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px">
              <span style="font-size:11px;font-weight:800;color:#5a6584;text-transform:uppercase;letter-spacing:.06em">${centerLabel}</span>
              <span class="num" style="font-size:15px;color:#0f1b3d">${BRL(centerV)}</span>
            </div>
          </div>
          <div style="flex:1 1 220px;min-width:0;display:flex;flex-direction:column;gap:10px">
            ${out.map(g => `
              <div style="display:flex;align-items:center;gap:10px;font-size:14px;color:#3d4766" data-tip="${g.label}: ${g.vTxt} (${g.pTxt})">
                <span aria-hidden="true" style="width:12px;height:12px;border-radius:3px;flex:none;background:${g.cor}"></span>
                <span style="flex:1">${g.label}</span>
                <span class="num" style="color:#0f1b3d">${g.vTxt}</span>
                <span style="width:52px;text-align:right;font-size:12px;color:#5a6584">${g.pTxt}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function buildStackedBars(rows, legendItems) {
      return `
        <div style="display:flex;flex-direction:column;gap:16px">
          ${rows.map(b => {
            const tot = b.segs.reduce((t, g) => t + Math.max(0, g.v), 0) || 1;
            const validSegs = b.segs.filter(g => g.v > 0.004).map(g => ({
              ...g,
              vTxt: BRL(g.v),
              pTxt: P((g.v / tot) * 100),
              f: (g.v / tot).toFixed(4)
            }));
            const aria = `${b.nome}: ` + validSegs.map(g => `${g.label} ${g.vTxt}`).join(', ');
            return `
              <div style="display:flex;flex-direction:column;gap:6px">
                <div style="display:flex;justify-content:space-between;gap:8px;font-size:14px">
                  <span style="font-weight:800;color:#0f1b3d">${b.nome}</span>
                  <span class="num" style="color:#5a6584">${BRL(b.tot)}</span>
                </div>
                <div role="img" aria-label="${aria}" style="display:flex;gap:2px;height:24px;background:#f4f6fb;border-radius:4px">
                  ${validSegs.map(g => `
                    <div title="${g.label}: ${g.vTxt} (${g.pTxt})" data-tip="${b.nome} · ${g.label}: ${g.vTxt} (${g.pTxt})" style="height:100%;min-width:3px;border-radius:4px;background:${g.cor};flex:${g.f} 1 0px;cursor:pointer"></div>
                  `).join('')}
                </div>
              </div>
            `;
          }).join('')}
          <div style="display:flex;flex-wrap:wrap;gap:16px;font-size:13px;color:#3d4766;padding-top:4px">
            ${legendItems.map(l => `
              <span style="display:flex;align-items:center;gap:6px">
                <span aria-hidden="true" style="width:12px;height:12px;border-radius:3px;background:${l.cor}"></span>
                ${l.label}
              </span>
            `).join('')}
          </div>
        </div>
      `;
    }

    function buildWaterfall(steps) {
      const filtered = steps.filter(s => s.kind === 'start' || s.kind === 'total' || s.v > 0.004);
      let run = 0, max = 0;
      filtered.forEach(s => {
        if (s.kind === 'start' || s.kind === 'total') run = s.v;
        else if (s.kind === 'dec') run -= s.v;
        else run += s.v;
        max = Math.max(max, run, s.v);
      });
      max = max || 1;
      run = 0;

      const rows = filtered.map(s => {
        const a = run;
        let b, x, w;
        if (s.kind === 'start' || s.kind === 'total') {
          b = s.v;
          x = 0;
          w = (Math.max(0, b) / max) * 100;
        } else if (s.kind === 'dec') {
          b = a - s.v;
          x = (Math.max(0, b) / max) * 100;
          w = ((Math.max(0, a) - Math.max(0, b)) / max) * 100;
        } else {
          b = a + s.v;
          x = (Math.max(0, a) / max) * 100;
          w = ((Math.max(0, b) - Math.max(0, a)) / max) * 100;
        }
        run = b;
        const big = s.kind === 'start' || s.kind === 'total';
        const vTxt = s.kind === 'dec' ? BRL(-s.v) : s.kind === 'inc' ? '+ ' + BRL(s.v) : BRL(s.v);
        return { label: s.label, x: x.toFixed(2), w: Math.max(w, 0.8).toFixed(2), cor: s.cor, vTxt, fw: big ? '800' : '600' };
      });

      const aria = rows.map(r => `${r.label}: ${r.vTxt}`).join('; ');

      return `
        <div role="img" aria-label="Gráfico em cascata: ${aria}" style="display:flex;flex-direction:column;gap:8px">
          ${rows.map(w => `
            <div style="display:grid;grid-template-columns:minmax(140px,230px) minmax(0,1fr) 135px;gap:14px;align-items:center;font-size:13px">
              <span style="color:#3d4766;font-weight:${w.fw}">${w.label}</span>
              <div title="${w.label}: ${w.vTxt}" data-tip="${w.label}: ${w.vTxt}" style="position:relative;height:24px;background:#f4f6fb;border-radius:4px">
                <div style="position:absolute;top:3px;bottom:3px;border-radius:4px;left:${w.x}%;width:${w.w}%;background:${w.cor}"></div>
              </div>
              <span class="num" style="text-align:right;color:#0f1b3d;font-weight:${w.fw}">${w.vTxt}</span>
            </div>
          `).join('')}
        </div>
      `;
    }

    // Cálculo completo de todos os eventos da produtora selecionada
    function getFinanceCalculatedState() {
      const db = window.dbState;
      const prodId = window.ui.produtoraId;
      const prod = db.produtoras[prodId];
      const { calcEvento, calcConsolidado } = window.MotorRepasse;

      const advList = Object.entries(db.advanced || {}).map(([id, a]) => ({ id, ...a })).filter(a => a.produtoraId === prodId);
      const antList = Object.entries(db.antecipacoes || {}).map(([id, a]) => ({ id, ...a })).filter(a => a.produtoraId === prodId);
      const despList = Object.entries(db.despesas || {}).map(([id, d]) => ({ id, ...d })).filter(d => d.produtoraId === prodId);

      const evMap = {};
      const evArr = [];

      for (const [evId, ev] of Object.entries(db.eventos || {})) {
        if (ev.produtoraId !== prodId) continue;
        const fin = db.eventos_fin[evId];
        const neg = db.negociacoes[evId];
        const loc = db.locais[ev.localId];
        const despEv = despList.filter(d => d.eventoId === evId);
        const advEv = advList.filter(a => a.escopo === evId);
        const antEv = antList.filter(a => a.eventoId === evId);

        const c = calcEvento({ id: evId, ...ev }, fin, neg, despEv, advEv, antEv, loc);
        evMap[evId] = { id: evId, ev, fin, neg, loc, calc: c };
        evArr.push({ id: evId, liberadoParaSolicitacao: ev.liberadoParaSolicitacao, ...c });
      }

      const cons = calcConsolidado(prod, evArr, advList);
      return { prodId, prod, evMap, evArr, cons, advList, antList, despList };
    }

                                <input class="in" style="width:98px;padding:6px;min-height:36px" type="number" placeholder="R$ Fixo" value="${r.valorFixo}" oninput="window.updateFin('${id}', f => f.retencoes[${idx}].valorFixo = Number(this.value||0))" />
                              ` : ''}
                              ${(r.tipo === 'porIngresso' || r.tipo === 'porCapacidade') ? `
                                <input class="in" style="width:90px;padding:6px;min-height:36px" type="number" placeholder="R$ Unit" value="${r.valorUnitario}" oninput="window.updateFin('${id}', f => f.retencoes[${idx}].valorUnitario = Number(this.value||0))" />
                              ` : ''}
                            </div>
                          </td>
                          <td>
                            <select class="in tx" style="padding:6px 8px;min-height:36px" onchange="window.updateFin('${id}', f => f.retencoes[${idx}].responsavel = this.value)">
                              <option value="disk" ${r.responsavel === 'disk' ? 'selected' : ''}>Disk</option>
                              <option value="produtor" ${r.responsavel === 'produtor' ? 'selected' : ''}>Produtor</option>
                            </select>
                          </td>
                          <td>
                            <select class="in tx" style="padding:6px 8px;min-height:36px" onchange="window.updateFin('${id}', f => f.retencoes[${idx}].status = this.value)">
                              <option value="provisionado" ${r.status === 'provisionado' ? 'selected' : ''}>Provisionado</option>
                              <option value="pago" ${r.status === 'pago' ? 'selected' : ''}>Pago</option>
                            </select>
                          </td>
                          <td class="num" style="text-align:right">${BRL(det.valor)}</td>
                        </tr>
                      `;
                    }).join('')}
                  </tbody>
                </table>
              </div>
            </section>

            <!-- 5. Descontos Operacionais -->
            <section class="card">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <h2 class="h2">5. Descontos operacionais (Total: ${BRL(c.totOps)})</h2>
                <button class="btn btn-outline btn-sm" onclick="window.addDescontoOp('${id}')">+ Outro desconto</button>
              </div>
              <table>
                <thead>
                  <tr><th>Aplicar</th><th>Item</th><th>Quantidade</th><th>Valor Unitário (R$)</th><th style="text-align:right">Total</th></tr>
                </thead>
                <tbody>
                  ${fin.descontosOperacionais.map((d, idx) => `
                    <tr>
                      <td><input type="checkbox" ${d.ativo ? 'checked' : ''} onchange="window.updateFin('${id}', f => f.descontosOperacionais[${idx}].ativo = this.checked)" /></td>
                      <td><input class="in tx" style="padding:6px 8px;min-height:36px" value="${d.nome}" oninput="window.updateFin('${id}', f => f.descontosOperacionais[${idx}].nome = this.value)" /></td>
                      <td><input class="in" style="width:90px;padding:6px 8px;min-height:36px" type="number" value="${d.quantidade}" oninput="window.updateFin('${id}', f => f.descontosOperacionais[${idx}].quantidade = Number(this.value||0))" /></td>
                      <td><input class="in" style="width:120px;padding:6px 8px;min-height:36px" type="number" value="${d.valorUnitario}" oninput="window.updateFin('${id}', f => f.descontosOperacionais[${idx}].valorUnitario = Number(this.value||0))" /></td>
                      <td class="num" style="text-align:right">${BRL(d.ativo ? d.quantidade * d.valorUnitario : 0)}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </section>

            <!-- 6. Créditos -->
            <section class="card">
              <h2 class="h2">6. Créditos comerciais (Saem da Taxa Adm do Disk: máx ${BRL(c.taxaAdm)})</h2>
              ${c.excedente > 0 ? `
                <div class="alert-box alert-warn">⚠️ Alerta de Excedente: Rebate + Patrocínio somam ${BRL(c.rebateBruto + c.patrocinioBruto)}, ultrapassando a Taxa Adm (${BRL(c.taxaAdm)}). Excedente de ${BRL(c.excedente)} NÃO creditado.</div>
              ` : ''}
              <div class="grid-2">
                <div style="border:1px solid #dde2ee;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px">
                  <label style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px">
                    <input type="checkbox" ${fin.rebate.ativo ? 'checked' : ''} onchange="window.updateFin('${id}', f => f.rebate.ativo = this.checked)" />
                    Rebate Comercial (Creditado: ${BRL(c.rebate)})
                  </label>
                  <div style="display:flex;gap:8px">
                    <select class="in tx" onchange="window.updateFin('${id}', f => f.rebate.tipo = this.value)">
                      <option value="percentual" ${fin.rebate.tipo === 'percentual' ? 'selected' : ''}>% Bilheteria</option>
                      <option value="fixo" ${fin.rebate.tipo === 'fixo' ? 'selected' : ''}>R$ Fixo</option>
                    </select>
                    <input class="in" type="number" step="0.5" value="${fin.rebate.valor}" oninput="window.updateFin('${id}', f => f.rebate.valor = Number(this.value||0))" />
                  </div>
                </div>

                <div style="border:1px solid #dde2ee;border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px">
                  <label style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px">
                    <input type="checkbox" ${fin.patrocinioEvento.ativo ? 'checked' : ''} onchange="window.updateFin('${id}', f => f.patrocinioEvento.ativo = this.checked)" />
                    Patrocínio do Evento (Creditado: ${BRL(c.patrocinio)})
                  </label>
                  <input class="in tx" placeholder="Descrição" value="${fin.patrocinioEvento.descricao || ''}" oninput="window.updateFin('${id}', f => f.patrocinioEvento.descricao = this.value)" />
                  <input class="in" type="number" step="100" value="${fin.patrocinioEvento.valor}" oninput="window.updateFin('${id}', f => f.patrocinioEvento.valor = Number(this.value||0))" />
                </div>
              </div>
              <label style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;cursor:pointer">
                <input type="checkbox" ${fin.regra.creditosSujeitosTrava ? 'checked' : ''} onchange="window.updateFin('${id}', f => f.regra.creditosSujeitosTrava = this.checked)" />
                Créditos sujeitos às travas de receita e capacidade (se desmarcado, entram livres após a trava)
              </label>
            </section>

            <!-- 7. Regra de Liberação e Faixas -->
            <section class="card">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <h2 class="h2">7. Regra de travas e faixas de capacidade</h2>
                <button class="btn btn-outline btn-sm" onclick="window.addFaixa('${id}')">+ Adicionar faixa</button>
              </div>
              <div class="grid-3">
                <label class="lb">Modo da regra
                  <select class="in tx" onchange="window.updateFin('${id}', f => f.regra.modo = this.value)">
                    <option value="MIN" ${fin.regra.modo === 'MIN' ? 'selected' : ''}>MIN(A, B) — Mais restritiva</option>
                    <option value="A" ${fin.regra.modo === 'A' ? 'selected' : ''}>Somente Regra A (Resultado)</option>
                    <option value="B" ${fin.regra.modo === 'B' ? 'selected' : ''}>Somente Regra B (Capacidade)</option>
                  </select>
                </label>
                <label class="lb">Regra A · % sobre Resultado
                  <input class="in" type="number" value="${fin.regra.pctResultado}" oninput="window.updateFin('${id}', f => f.regra.pctResultado = Number(this.value||0))" />
                </label>
                <label class="lb">Reserva reembolso (% bilheteria)
                  <input class="in" type="number" value="${fin.regra.reservaReembolsoPct}" oninput="window.updateFin('${id}', f => f.regra.reservaReembolsoPct = Number(this.value||0))" />
                </label>
                <label class="lb">Teto máximo R$ (0 = sem teto)
                  <input class="in" type="number" value="${fin.regra.teto}" oninput="window.updateFin('${id}', f => f.regra.teto = Number(this.value||0))" />
                </label>
                <label class="lb">Libera 100% em D+ (dias úteis bancários)
                  <input class="in" type="number" value="${fin.regra.liberaTotalDmais}" oninput="window.updateFin('${id}', f => f.regra.liberaTotalDmais = Number(this.value||0))" />
                  <span class="sub" style="text-transform:none;font-weight:600;color:#1e3a8a">Liberação 100%: ${c.dataLiberacaoTotal || '—'} (s/ sáb, dom e feriados)</span>
                </label>
              </div>

              <table>
                <thead>
                  <tr><th>Gatilho (% vendido)</th><th>Ingressos equivalentes</th><th>% Resultado Liberado (B)</th><th>Status</th><th></th></tr>
                </thead>
                <tbody>
                  ${fin.regra.faixas.map((f, idx) => {
                    const isAtual = c.faixaAtual && c.faixaAtual.gatilhoPct === Number(f.gatilhoPct);
                    return `
                      <tr>
                        <td><input class="in" style="width:90px;padding:6px;min-height:36px" type="number" value="${f.gatilhoPct}" oninput="window.updateFin('${id}', fn => fn.regra.faixas[${idx}].gatilhoPct = Number(this.value||0))" /></td>
                        <td class="num">${Math.ceil((Number(f.gatilhoPct) / 100) * c.capacidadeUsada)} ing.</td>
                        <td><input class="in" style="width:90px;padding:6px;min-height:36px" type="number" value="${f.liberaPct}" oninput="window.updateFin('${id}', fn => fn.regra.faixas[${idx}].liberaPct = Number(this.value||0))" /></td>
                        <td>${isAtual ? `<span class="bdg">Faixa atual (${f.liberaPct}%)</span>` : (c.pctVendido >= f.gatilhoPct ? '<span class="sub">Superada</span>' : '<span class="sub">Pendente</span>')}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="window.removeFaixa('${id}', ${idx})">Remover</button></td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </section>
          </div>

          <!-- Coluna Lateral: Prévia Linha a Linha -->
          <aside style="flex:1 1 360px;min-width:0;position:sticky;top:20px">
            <section class="card" style="border:2px solid #1e3a8a">
              <h2 class="h2">Prévia do cálculo · ${ev.nome}</h2>
              <div style="display:flex;flex-direction:column">
                <div class="row"><span>Bilheteria</span><span class="num">${BRL(c.bil)}</span></div>
                <div class="row"><span>(−) Taxa Adm (${fin.taxaAdm.percentual}%)</span><span class="num">${BRL(-c.taxaAdm)}</span></div>
                <div class="row"><span>(−) Taxa Operacional</span><span class="num">${BRL(-c.taxaOp)}</span></div>
                <div class="row" style="border-top:1px solid #dde2ee;padding-top:8px;font-weight:800;color:#0f1b3d"><span>(=) Borderô do Produtor</span><span class="num">${BRL(c.bil - c.taxaAdm - c.taxaOp)}</span></div>
                <div class="row"><span>(−) Despesas (${c.abaterDespesasAPagar ? 'Pagas + A pagar' : 'Só Pagas'})</span><span class="num">${BRL(-c.despesas)}</span></div>
                <div class="row"><span>(−) Retenções provisionadas</span><span class="num">${BRL(-c.totRetencoes)}</span></div>
                <div class="row"><span>(−) Descontos operacionais</span><span class="num">${BRL(-c.totOps)}</span></div>
                ${c.reserva > 0 ? `<div class="row"><span>(−) Reserva reembolso</span><span class="num">${BRL(-c.reserva)}</span></div>` : ''}
                <div class="row" style="border-top:1px solid #dde2ee;padding-top:8px;font-weight:800;color:#0f1b3d"><span>(=) Resultado do evento</span><span class="num">${BRL(c.resultado)}</span></div>
                <div class="row"><span>• Regra A (${c.pctResultado}%)</span><span class="num">${BRL(c.A)}</span></div>
                <div class="row"><span>• Regra B (${c.liberaPctB}% p/ ${P(c.pctVendido)})</span><span class="num">${BRL(c.B)}</span></div>
                <div class="row" style="font-weight:700"><span>(=) Escolhido (${c.modo})</span><span class="num">${BRL(c.escolhido)}</span></div>
                <div class="row"><span>(+) Créditos (rebate + patroc.)</span><span class="num" style="color:#065f46">${BRL(c.creditos)}</span></div>
                <div class="row"><span>(−) Já repassado</span><span class="num">${BRL(-c.jaRepassado)}</span></div>
                ${c.advEv > 0 ? `<div class="row"><span>(−) Advanced evento</span><span class="num">${BRL(-c.advEv)}</span></div>` : ''}
                ${c.antEv > 0 ? `<div class="row"><span>(−) Antecipação + taxa</span><span class="num">${BRL(-c.antEv)}</span></div>` : ''}
              </div>

              <div style="background:#ecfdf5;border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center">
                <span style="font-weight:800;color:#065f46">Liberável no evento</span>
                <span class="num" style="font-size:20px;color:#065f46">${BRL(c.liberavel)}</span>
              </div>

              <div class="row"><span>Retido pelas travas</span><span class="num" style="color:#9a3412">${BRL(c.retido)}</span></div>
              <div class="row"><span>Saldo devedor</span><span class="num">${BRL(c.saldoDevedor)}</span></div>
              <div class="row"><span>Taxa Adm Líquida Disk</span><span class="num" style="color:#7c3aed">${BRL(c.taxaAdmLiquida)}</span></div>

              <div style="display:flex;flex-direction:column;gap:8px">
                <button class="btn btn-primary" onclick="window.salvarConfigEvento('${id}')">💾 Salvar alterações (com Auditoria)</button>
                <button class="btn btn-outline" onclick="window.abrirBorderoPDF('${id}')">📄 Emitir Borderô / Fechamento (PDF)</button>
              </div>
            </section>
          </aside>
        </div>
      `;
    }

    // ========================================================================
    // MÓDULO 2: NEGOCIAÇÕES
    // ========================================================================
    function renderModuloNegociacoes(S) {
      return `
        <div class="mods">
          ${Object.values(S.evMap).map(({ id, ev, neg, calc }) => `
            <section class="card">
              <div style="display:flex;justify-content:space-between;align-items:center">
                <h2 class="h2">${ev.nome}</h2>
                <select class="in tx" style="width:auto;min-height:36px;padding:6px 10px" onchange="window.updateNeg('${id}', n => n.status = this.value)">
                  <option value="Ativa" ${neg.status === 'Ativa' ? 'selected' : ''}>Ativa</option>
                  <option value="Em revisão" ${neg.status === 'Em revisão' ? 'selected' : ''}>Em revisão</option>
                  <option value="Encerrada" ${neg.status === 'Encerrada' ? 'selected' : ''}>Encerrada</option>
                </select>
              </div>
              <div class="grid-2">
                <label class="lb">Forma da Taxa Operacional
                  <select class="in tx" onchange="window.updateNeg('${id}', n => n.taxaOp.tipo = this.value)">
                    <option value="porIngresso" ${neg.taxaOp.tipo === 'porIngresso' ? 'selected' : ''}>R$ por ingresso vendido</option>
                    <option value="percentual" ${neg.taxaOp.tipo === 'percentual' ? 'selected' : ''}>% sobre bilheteria</option>
                    <option value="fixo" ${neg.taxaOp.tipo === 'fixo' ? 'selected' : ''}>Valor fixo (R$)</option>
                  </select>
                </label>
                <label class="lb">Valor da Taxa Op
                  <input class="in" type="number" step="0.5" value="${neg.taxaOp.valor}" oninput="window.updateNeg('${id}', n => n.taxaOp.valor = Number(this.value||0))" />
                </label>
              </div>
              <div class="row" style="background:#f4f6fb;padding:10px 12px;border-radius:10px">
                <span>Taxa Operacional Calculada:</span>
                <span class="num" style="color:#7c3aed">${BRL(calc.taxaOp)}</span>
              </div>
              <label class="lb">Taxa de Conveniência (% informativo — paga pelo cliente, nunca entra no cálculo)
                <input class="in" type="number" value="${neg.conveniencia?.percentual || 0}" oninput="window.updateNeg('${id}', n => { n.conveniencia = { percentual: Number(this.value||0) }; })" />
              </label>
              <label class="lb">Observações da Negociação
                <input class="in tx" value="${neg.observacoes || ''}" oninput="window.updateNeg('${id}', n => n.observacoes = this.value)" />
              </label>
            </section>
          `).join('')}
        </div>
      `;
    }

    // ========================================================================
    // MÓDULO 2.5: TRILHA DE AUDITORIA (AUDIT LOG)
    // ========================================================================
    function renderModuloAuditoria(S, audList) {
      return `
        <section class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
            <div>
              <h2 class="h2">🕓 Trilha de Auditoria · Histórico de Alterações</h2>
              <div class="sub">Registro cronológico de aprovações, recusas, liquidações bancárias, ajustes de travas/taxas e lançamentos de despesas.</div>
            </div>
            <span class="bdg info">${audList.length} evento(s) auditado(s)</span>
          </div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>Data / Hora</th>
                  <th>Usuário</th>
                  <th>Módulo</th>
                  <th>Evento(s)</th>
                  <th>Ação</th>
                  <th>Detalhamento (Antes / Depois)</th>
                </tr>
              </thead>
              <tbody>
                ${audList.map(a => `
                  <tr>
                    <td class="num" style="font-size:12.5px;white-space:nowrap">${a.dataHora}</td>
                    <td style="font-size:13px;font-weight:700">${a.usuario}</td>
                    <td><span class="bdg info" style="margin:0">${a.modulo}</span></td>
                    <td><strong>${S.evMap[a.eventoId]?.ev.nome || a.eventoId || 'Geral'}</strong></td>
                    <td style="font-weight:800;color:#0f1b3d">${a.acao}</td>
                    <td style="font-size:13px;color:#3d4766">${a.resumo}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // ========================================================================
    // MÓDULO 3: SALDO CONSOLIDADO (FINANCEIRO)
    // ========================================================================
    function renderModuloSaldoConsolidado(S) {
      const { prod, evArr, evMap, cons } = S;
      const stackedRows = evArr.map(e => ({
        nome: evMap[e.id].ev.nome,
        tot: e.bil,
        segs: [
          { label: 'Taxa Disk', v: e.taxaAdmLiquida + e.taxaOp, cor: CO.disk },
          { label: 'Retenções', v: e.totRetencoes + e.reserva, cor: CO.rtc },
          { label: 'Despesas + Descontos', v: e.despesas + e.totOps, cor: CO.cus },
          { label: 'Já pago', v: Math.max(0, e.jaRepassado + e.advEv + e.antEv - e.saldoDevedor), cor: CO.rep },
          { label: 'Liberável', v: e.liberavel, cor: CO.lib },
          { label: 'Retido', v: e.retido, cor: CO.ret }
        ]
      }));

      return `
        <section class="card">
          <h2 class="h2">Bilheteria e situação por evento</h2>
          ${buildStackedBars(stackedRows, [
            { label: 'Taxa Disk', cor: CO.disk },
            { label: 'Retenções', cor: CO.rtc },
            { label: 'Despesas e descontos', cor: CO.cus },
            { label: 'Já pago', cor: CO.rep },
            { label: 'Liberável', cor: CO.lib },
            { label: 'Retido', cor: CO.ret }
          ])}
        </section>

        <div style="display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start">
          <section class="card" style="flex:999 1 620px;min-width:0">
            <h2 class="h2">Eventos da produtora</h2>
            <div style="overflow-x:auto">
              <table>
                <thead>
                  <tr>
                    <th>Liberado p/ solicitação</th>
                    <th>Evento</th>
                    <th style="text-align:right">% Vendido</th>
                    <th style="text-align:right">Taxa Adm Líq.</th>
                    <th style="text-align:right">Resultado</th>
                    <th style="text-align:right">Liberável</th>
                    <th style="text-align:right">Devedor</th>
                  </tr>
                </thead>
                <tbody>
                  ${evArr.map(e => {
                    const ev = evMap[e.id].ev;
                    return `
                      <tr>
                        <td>
                          <input type="checkbox" ${ev.liberadoParaSolicitacao ? 'checked' : ''} onchange="window.updateEv('${e.id}', x => x.liberadoParaSolicitacao = this.checked)" style="width:18px;height:18px" />
                        </td>
                        <td><strong>${ev.nome}</strong><div class="sub">${ev.data}</div></td>
                        <td class="num" style="text-align:right">${P(e.pctVendido)}</td>
                        <td class="num" style="text-align:right">${BRL(e.taxaAdmLiquida)}</td>
                        <td class="num" style="text-align:right">${BRL(e.resultado)}</td>
                        <td class="num" style="text-align:right;color:#065f46">${BRL(e.liberavel)}</td>
                        <td class="num" style="text-align:right;color:#991b1b">${BRL(e.saldoDevedor)}</td>
                      </tr>
                    `;
                  }).join('')}
                </tbody>
              </table>
            </div>
          </section>

          <aside style="flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:20px">
            <section class="card">
              <h2 class="h2">Patrocínio da produtora</h2>
              <div class="sub">Sai da Taxa Adm Líquida total dos eventos liberados (limite atual: <strong>${BRL(cons.taxaAdmLiqTotal)}</strong>).</div>
              ${cons.excedentePatrocinioProdutora > 0 ? `
                <div class="alert-box alert-warn">⚠️ Excedente de ${BRL(cons.excedentePatrocinioProdutora)} bloqueado! Creditado apenas até o limite da Taxa Adm Líquida (${BRL(cons.taxaAdmLiqTotal)}).</div>
              ` : ''}
              <label style="display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px">
                <input type="checkbox" ${prod.patrocinio.ativo ? 'checked' : ''} onchange="window.updateProd(p => p.patrocinio.ativo = this.checked)" />
                Ativar patrocínio da produtora
              </label>
              <label class="lb">Descrição
                <input class="in tx" value="${prod.patrocinio.descricao}" oninput="window.updateProd(p => p.patrocinio.descricao = this.value)" />
              </label>
              <label class="lb">Valor contratado (R$)
                <input class="in" type="number" step="100" value="${prod.patrocinio.valor}" oninput="window.updateProd(p => p.patrocinio.valor = Number(this.value||0))" />
              </label>
            </section>

            <section class="card" style="border:2px solid #1e3a8a">

    // MÓDULO 4: SOLICITAÇÕES DE REPASSE (COM RATEIO PROPORCIONAL/MANUAL, PROTOCOLO E RECIBO PDF)
    // ========================================================================
    function renderModuloSolicitacoes(S, repList) {
      const cfgTransf = (window.dbState.config && window.dbState.config.transferencia) || { pixValor: 0, tedValor: 10 };
      const { calcTransferencia } = window.MotorRepasse;
      return `

            <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
              <div class="in" style="width:auto;background:#ecfdf5;border-color:#a7f3d0;color:#065f46;font-weight:700;display:flex;align-items:center;gap:6px">

              </div>
              <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:#3d4766">

          <div class="sub">Escolha entre rateio proporcional automático ou rateio manual por evento, anexe protocolo PIX/TED e emita o comprovante oficial de repasse em PDF.</div>
          <div style="overflow-x:auto">
            <table>
              <thead>
                <tr>
                  <th>Solicitado em</th>
                  <th>Eventos / Rateio</th>
                  <th>Forma / Conta</th>
                  <th style="text-align:right">Valor Bruto</th>
                  <th style="text-align:right">Tarifa</th>
                  <th style="text-align:right">Valor Líquido</th>
                  <th>Status / Protocolo</th>
                  <th>Documentos</th>
                  <th>Ações</th>
                </tr>
              </thead>
              <tbody>
                ${repList.map(r => {
                  const nomes = (r.eventoIds || []).map(id => S.evMap[id]?.ev.nome || id).join(' + ');
                  const tr = calcTransferencia(r.valorSolicitado, r.forma, cfgTransf);
                  const tarifaExibida = r.tarifaTransferencia !== undefined ? r.tarifaTransferencia : tr.tarifa;
                  const liqExibido = r.valorLiquido !== undefined ? r.valorLiquido : tr.valorLiquido;
                  const rateioObj = (r.memoriaCalculo && (r.memoriaCalculo.rateioAplicado || r.memoriaCalculo.rateioEventos)) || null;
                  const rateioTxt = rateioObj
                    ? Object.entries(rateioObj).map(([eid, q]) => `${S.evMap[eid]?.ev.nome || eid}: ${BRL(q)}`).join(' · ')
                    : '';
                  return `
                    <tr>
                      <td>${r.solicitadoEm || '—'}</td>
                      <td>
                        <strong>${nomes}</strong>
                        ${rateioTxt ? `<div class="sub" style="font-size:11.5px">Rateio (${r.modoRateio || 'prop.'}): ${rateioTxt}</div>` : ''}
                      </td>
                      <td>${r.forma} · Conta ${r.contaId}</td>
                      <td class="num" style="text-align:right">${BRL(r.valorSolicitado)}</td>
                      <td class="num" style="text-align:right;color:#5a6584">${tarifaExibida > 0 ? BRL(-tarifaExibida) : 'R$ 0,00'}</td>
                      <td class="num" style="text-align:right;color:#065f46">${BRL(liqExibido)}</td>
                      <td>
                        <span class="bdg ${r.status === 'Solicitado' ? 'warn' : (r.status === 'Aprovado' ? 'info' : '')}">${r.status}</span>
                        ${r.protocoloBancario ? `<div class="num" style="font-size:11px;color:#3d4766;margin-top:4px">${r.protocoloBancario}</div>` : ''}
                      </td>
                      <td>
                        <div style="display:flex;gap:6px;flex-wrap:wrap">
                          ${r.memoriaCalculo ? `<button class="btn btn-soft btn-sm" onclick="window.abrirModalMemoria('${r.id}')">Memória</button>` : ''}
                          ${(r.status === 'Aprovado' || r.status === 'Pago') ? `<button class="btn btn-outline btn-sm" onclick="window.abrirReciboRepassePDF('${r.id}')">🧾 Recibo PDF</button>` : ''}
                        </div>
                      </td>
                      <td>
                        ${r.status === 'Solicitado' ? `
                          <div style="display:flex;gap:6px;flex-wrap:wrap">
                            <button class="btn btn-green btn-sm" onclick="window.abrirModalAprovarRepasse('${r.id}')">Analisar / Rateio</button>
                            <button class="btn btn-danger btn-sm" onclick="window.decidirRepasseUI('${r.id}','recusar')">Recusar</button>
                          </div>
                        ` : r.status === 'Aprovado' ? `
                          <button class="btn btn-primary btn-sm" onclick="window.abrirModalLiquidarRepasse('${r.id}')">Confirmar PIX/TED (Pago)</button>

                      </td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        </section>
      `;
    }

    // ========================================================================

      return `
        <section class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">

      `;

    // ========================================================================
    // HANDLERS GLOBAIS DE INTERAÇÃO, MODAIS DE RATEIO E IMPRESSÃO PDF
    // ========================================================================
    window.setTab = (t) => { window.ui.tab = t; window.ui.savedBanner = false; window.render(); };
    window.updateEv = (evId, fn) => { fn(window.dbState.eventos[evId]); saveDB(); window.render(); };
    window.updateFin = (evId, fn) => { fn(window.dbState.eventos_fin[evId]); saveDB(); window.render(); };
    window.updateNeg = (evId, fn) => { fn(window.dbState.negociacoes[evId]); saveDB(); window.render(); };
    window.updateProd = (fn) => { fn(window.dbState.produtoras[window.ui.produtoraId]); saveDB(); window.render(); };
    window.salvarConfigEvento = (evId) => {
      const targetId = evId || window.ui.evId;
      const fin = window.dbState.eventos_fin[targetId];
      const ev = window.dbState.eventos[targetId];
      registrarLogAuditoria(
        'Travas e Taxas',
        targetId,
        'Salvo Configuração do Evento',
        `Bilheteria ${BRL(ev.bilheteria)} (${ev.vendas.vendidos} ing.); Taxa Adm ${fin.taxaAdm.percentual}%; Regra ${fin.regra.modo} (${fin.regra.pctResultado}% resultado, D+${fin.regra.liberaTotalDmais} dias úteis).`
      );
      saveDB();
      window.ui.savedBanner = true;
      window.render();
    };

    window.toggleSetor = (evId, nome, checked) => {
      const arr = window.dbState.eventos[evId].capacidade.setoresAbertos || [];
      window.dbState.eventos[evId].capacidade.setoresAbertos = checked
        ? [...new Set([...arr, nome])]
        : arr.filter(x => x !== nome);
      saveDB();
      window.render();
    };

    window.addRetencao = (evId) => {
      window.dbState.eventos_fin[evId].retencoes.push({
        id: 'ret_' + Date.now(), nome: 'Nova Retenção', ativo: true, tipo: 'fixo', base: 'bruto',
        percentual: 0, valorFixo: 500, valorUnitario: 0, responsavel: 'disk', status: 'provisionado'
      });
      saveDB(); window.render();
    };

    window.addDescontoOp = (evId) => {
      window.dbState.eventos_fin[evId].descontosOperacionais.push({
        id: 'op_' + Date.now(), nome: 'Item Operacional', ativo: true, quantidade: 1, valorUnitario: 200
      });
      saveDB(); window.render();
    };

    window.addFaixa = (evId) => {
      window.dbState.eventos_fin[evId].regra.faixas.push({ gatilhoPct: 90, liberaPct: 85 });
      saveDB(); window.render();
    };

    window.removeFaixa = (evId, idx) => {
      window.dbState.eventos_fin[evId].regra.faixas.splice(idx, 1);
      saveDB(); window.render();
    };

    window.updateAdv = (id, fn) => { fn(window.dbState.advanced[id]); saveDB(); window.render(); };
    window.addAdvanced = () => {
      const id = 'adv_' + Date.now();
      window.dbState.advanced[id] = {
        produtoraId: window.ui.produtoraId, data: '13/10/2026', descricao: 'Novo Adiantamento',
        valor: 1000, escopo: 'consolidado', abaterNoProximo: true
      };
      registrarLogAuditoria('Advanced', 'consolidado', 'Inclusão de Adiantamento', 'Novo adiantamento de R$ 1.000,00 lançado.');
      saveDB(); window.render();
    };
    window.removeAdv = (id) => { delete window.dbState.advanced[id]; saveDB(); window.render(); };

    window.toggleAntAbater = (id, ch) => { window.dbState.antecipacoes[id].abaterNoProximo = ch; saveDB(); window.render(); };
    window.decidirAntecipacao = (id, st) => {
      window.dbState.antecipacoes[id].status = st;
      registrarLogAuditoria('Antecipações', window.dbState.antecipacoes[id].eventoId, `Antecipação ${st}`, `Antecipação ${id} marcada como ${st}.`);
      saveDB(); window.render();
    };

    window.acaoConta = (id, acao) => {
      const map = window.dbState.contas[window.ui.produtoraId];
      if (acao === 'padrao') {
        Object.values(map).forEach(c => { c.padrao = false; });
        map[id].padrao = true;
        map[id].status = 'Validada';
      } else {
        map[id].status = acao;
      }
      registrarLogAuditoria('Contas Bancárias', 'Geral', `Conta ${id}: ${acao}`, `Status da conta bancária atualizado.`);
      saveDB(); window.render();
    };

    window.updateDesp = (id, fn) => { fn(window.dbState.despesas[id]); saveDB(); window.render(); };
    window.addDespesa = () => {
      const id = 'desp_' + Date.now();
      window.dbState.despesas[id] = {
        eventoId: 'polaquedo', produtoraId: window.ui.produtoraId, data: '13/10/2026',
        categoria: 'Nova Despesa', fornecedor: 'Fornecedor PR', valor: 500, status: 'Pago',
        nfCodigo: 'NF-e 000.999', comprovanteUrl: ''
      };
      registrarLogAuditoria('Despesas', 'polaquedo', 'Lançamento de Despesa', 'Nova despesa de R$ 500,00 (NF-e 000.999).');
      saveDB(); window.render();
    };
    window.removeDesp = (id) => { delete window.dbState.despesas[id]; saveDB(); window.render(); };

    // Modal de Aprovação com Rateio Proporcional ou Manual + Opção Aprovar vs Aprovar e Pagar
    window.abrirModalAprovarRepasse = (repId) => {
      const rep = window.dbState.repasses[repId];
      if (!rep) return;
      const S = getFinanceCalculatedState();
      const sel = S.evArr.filter(e => (rep.eventoIds || []).includes(e.id));
      const { calcularRateioRepasse } = window.MotorRepasse;
      const prop = calcularRateioRepasse(sel, rep.valorSolicitado, 'proporcional');

      window.ui.modalRepId = repId;
      window.ui.modalModoRateio = 'proporcional';
      window.ui.modalRateioManual = { ...prop.rateio };

      window.renderModalAprovacao();
      document.getElementById('modal-memoria').classList.add('open');
    };

    window.renderModalAprovacao = () => {
      const repId = window.ui.modalRepId;
      const rep = window.dbState.repasses[repId];
      const S = getFinanceCalculatedState();
      const sel = S.evArr.filter(e => (rep.eventoIds || []).includes(e.id));
      const { calcularRateioRepasse } = window.MotorRepasse;
      const resRateio = calcularRateioRepasse(sel, rep.valorSolicitado, window.ui.modalModoRateio, window.ui.modalRateioManual);

      document.getElementById('modal-memoria-body').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div>
            <h2 class="h2">Aprovação e Rateio de Repasse · ${repId}</h2>
            <div class="sub">Valor Bruto Solicitado: <strong class="num">${BRL(rep.valorSolicitado)}</strong> · Forma: <strong>${rep.forma}</strong></div>
          </div>
          <button class="btn btn-soft btn-sm" onclick="window.fecharModalMemoria()">Fechar</button>
        </div>

        <div style="display:flex;gap:10px;margin-bottom:16px">
          <button class="${window.ui.modalModoRateio === 'proporcional' ? 'pillOn' : 'pill'}" onclick="window.ui.modalModoRateio='proporcional';window.renderModalAprovacao()">
            Rateio Proporcional Automático
          </button>
          <button class="${window.ui.modalModoRateio === 'manual' ? 'pillOn' : 'pill'}" onclick="window.ui.modalModoRateio='manual';window.renderModalAprovacao()">
            Rateio Manual por Evento
          </button>
        </div>

        <table style="margin-bottom:16px">
          <thead>
            <tr><th>Evento</th><th style="text-align:right">Liberável Atual</th><th style="text-align:right">Quota a Abater (jaRepassado)</th></tr>
          </thead>
          <tbody>
            ${sel.map(e => {
              const qVal = resRateio.rateio[e.id] ?? 0;
              return `
                <tr>
                  <td><strong>${S.evMap[e.id]?.ev.nome || e.id}</strong></td>
                  <td class="num" style="text-align:right;color:#065f46">${BRL(e.liberavel)}</td>
                  <td style="text-align:right">
                    ${window.ui.modalModoRateio === 'manual' ? `
                      <input class="in" style="width:150px;min-height:36px;padding:6px 10px;text-align:right" type="number" step="10" value="${qVal}" oninput="window.ui.modalRateioManual['${e.id}']=Number(this.value||0);window.renderModalAprovacao()" />
                    ` : `<span class="num">${BRL(qVal)}</span>`}
                  </td>
                </tr>
              `;
            }).join('')}
          </tbody>
        </table>

        ${!resRateio.valido ? `<div class="alert-box alert-warn" style="margin-bottom:14px">⚠️ ${resRateio.erro}</div>` : `
          <div class="alert-box alert-ok" style="margin-bottom:14px">✓ Soma das quotas (${BRL(resRateio.somaRateio)}) confere exatamente com o valor solicitado (${BRL(rep.valorSolicitado)}).</div>
        `}

        <div class="grid-2" style="margin-bottom:18px">
          <label class="lb">Protocolo Bancário PIX / TED (opcional na aprovação, obrigatório no Pago)
            <input id="in-proto-rep" class="in tx" placeholder="Ex: PIX-E2E-20261014-8821" value="${rep.protocoloBancario || ''}" />
          </label>
          <label class="lb">URL do Comprovante Bancário (PDF/Imagem)
            <input id="in-comp-rep" class="in tx" placeholder="https://diskingressos.com.br/comprovantes/..." value="${rep.comprovanteUrl || ''}" />
          </label>
        </div>

        <div style="display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap">
          <button class="btn btn-outline" ${!resRateio.valido ? 'disabled' : ''} onclick="window.confirmarDecisaoRepasseModal('aprovar')">✓ Apenas Aprovar (Aguardando Banco)</button>
          <button class="btn btn-green" ${!resRateio.valido ? 'disabled' : ''} onclick="window.confirmarDecisaoRepasseModal('pagar')">💸 Aprovar e Marcar como Pago</button>
        </div>
      `;
    };

    window.confirmarDecisaoRepasseModal = (acaoFinal) => {
      const repId = window.ui.modalRepId;
      const proto = document.getElementById('in-proto-rep')?.value || '';
      const comp = document.getElementById('in-comp-rep')?.value || '';
      window.decidirRepasseUI(repId, acaoFinal, window.ui.modalModoRateio, window.ui.modalRateioManual, proto, comp);
      window.fecharModalMemoria();
    };

    window.abrirModalLiquidarRepasse = (repId) => {
      const rep = window.dbState.repasses[repId];
      if (!rep) return;
      document.getElementById('modal-memoria-body').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <h2 class="h2">Liquidar Repasse Aprovado · ${repId}</h2>
          <button class="btn btn-soft btn-sm" onclick="window.fecharModalMemoria()">Fechar</button>
        </div>
        <div class="sub" style="margin-bottom:14px">Informe o protocolo bancário PIX/TED e o link do comprovante para concluir a transferência de <strong>${BRL(rep.valorLiquido || rep.valorSolicitado)}</strong>.</div>
        <div class="grid-2" style="margin-bottom:18px">
          <label class="lb">Protocolo Bancário PIX / TED
            <input id="in-liq-proto" class="in tx" placeholder="Ex: PIX-ITAU-2026-99120" value="${rep.protocoloBancario || 'PIX-ITAU-' + Date.now()}" />
          </label>
          <label class="lb">URL do Comprovante
            <input id="in-liq-comp" class="in tx" placeholder="https://..." value="${rep.comprovanteUrl || 'https://diskingressos.com.br/comprovantes/pix-recibo.pdf'}" />
          </label>
        </div>
        <div style="display:flex;justify-content:flex-end;gap:10px">
          <button class="btn btn-green" onclick="window.confirmarLiquidacao('${repId}')">Confirmar Liquidação (Status: Pago)</button>
        </div>
      `;
      document.getElementById('modal-memoria').classList.add('open');
    };

    window.confirmarLiquidacao = (repId) => {
      const rep = window.dbState.repasses[repId];
      if (!rep) return;
      rep.status = 'Pago';
      rep.protocoloBancario = document.getElementById('in-liq-proto')?.value || '';
      rep.comprovanteUrl = document.getElementById('in-liq-comp')?.value || '';
      rep.pagoPor = 'financeiro@diskingressos.com.br';
      rep.pagoEm = new Date().toLocaleString('pt-BR');
      registrarLogAuditoria('Repasses', (rep.eventoIds || []).join(', '), 'Liquidação Bancária (Pago)', `Repasse ${repId} pago. Protocolo: ${rep.protocoloBancario}`);
      saveDB();
      window.fecharModalMemoria();
      window.render();
    };

    window.decidirRepasseUI = (repId, acao, modoRateio = 'proporcional', rateioManual = {}, protocoloBancario = '', comprovanteUrl = '') => {
      const rep = window.dbState.repasses[repId];
      if (!rep) return;
      if (acao === 'recusar') {
        const motivo = prompt('Informe o motivo da recusa:', 'Revisão de borderô pendente.');
        if (!motivo) return;
        rep.status = 'Recusado';
        rep.motivoRecusa = motivo;
        rep.decididoPor = 'financeiro@diskingressos.com.br';
        rep.decididoEm = new Date().toLocaleString('pt-BR');
        registrarLogAuditoria('Repasses', (rep.eventoIds || []).join(', '), 'Recusa de Repasse', `Repasse ${repId} recusado: ${motivo}`);
        saveDB(); window.render();
        return;
      }

      const S = getFinanceCalculatedState();
      const disp = S.cons.disponivel(rep.eventoIds || []);
      if (rep.valorSolicitado > disp + 0.01) {
        alert(`Recusado: Valor solicitado (${BRL(rep.valorSolicitado)}) supera o disponível atual (${BRL(disp)}).`);
        rep.status = 'Recusado';
        saveDB(); window.render();
        return;
      }

      const sel = S.evArr.filter(e => (rep.eventoIds || []).includes(e.id));
      const { calcularRateioRepasse } = window.MotorRepasse;
      const rateioRes = calcularRateioRepasse(sel, rep.valorSolicitado, modoRateio, rateioManual);
      if (!rateioRes.valido) {
        alert(rateioRes.erro);
        return;
      }

      sel.forEach(e => {
        const quota = Number(rateioRes.rateio[e.id] || 0);
        window.dbState.eventos[e.id].jaRepassado = Math.round((Number(window.dbState.eventos[e.id].jaRepassado || 0) + quota) * 100) / 100;
      });

      Object.values(window.dbState.advanced || {}).forEach(a => {
        if (a.produtoraId === rep.produtoraId && a.abaterNoProximo && (a.escopo === 'consolidado' || (rep.eventoIds || []).includes(a.escopo))) {
          a.abaterNoProximo = false;
        }
      });
      Object.values(window.dbState.antecipacoes || {}).forEach(a => {
        if (a.produtoraId === rep.produtoraId && a.abaterNoProximo && (rep.eventoIds || []).includes(a.eventoId)) {
          a.abaterNoProximo = false;
        }
      });

      const stFinal = acao === 'pagar' ? 'Pago' : 'Aprovado';
      rep.status = stFinal;
      rep.modoRateio = rateioRes.modo;
      rep.protocoloBancario = protocoloBancario;
      rep.comprovanteUrl = comprovanteUrl;
      rep.decididoPor = 'financeiro@diskingressos.com.br';
      rep.decididoEm = new Date().toLocaleString('pt-BR');
      if (stFinal === 'Pago') {
        rep.pagoPor = rep.decididoPor;
        rep.pagoEm = rep.decididoEm;
      }
      rep.memoriaCalculo = {
        aprovadoPor: rep.decididoPor,
        aprovadoEm: rep.decididoEm,
        disponivelNoMomento: disp,
        modoRateio: rateioRes.modo,
        rateioAplicado: rateioRes.rateio,
        eventosSnapshot: sel
      };
      registrarLogAuditoria('Repasses', (rep.eventoIds || []).join(', '), `Repasse ${stFinal}`, `Valor ${BRL(rep.valorSolicitado)} (${rep.forma}) — rateio ${rateioRes.modo}.`);
      saveDB(); window.render();
    };

    // Emissão de Fechamento de Borderô em PDF / Impressão (Visão Completa Financeiro)
    window.abrirBorderoPDF = (evId) => {
      const S = getFinanceCalculatedState();
      const item = S.evMap[evId];
      if (!item) return;
      const { ev, fin, loc, calc: c } = item;
      document.getElementById('modal-memoria-body').innerHTML = `
        <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #dde2ee">
          <span style="font-weight:800;color:#1e3a8a">📄 Pré-visualização de Impressão / PDF</span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
            <button class="btn btn-soft btn-sm" onclick="window.fecharModalMemoria()">Fechar</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:14px;font-size:13.5px">
          <div style="display:flex;justify-content:space-between;border-bottom:2px solid #1e3a8a;padding-bottom:12px">
            <div>
              <div style="font-size:11px;font-weight:800;color:#1e3a8a;text-transform:uppercase;letter-spacing:.08em">DiskIngressos · Fechamento Oficial de Borderô (Financeiro)</div>
              <div style="font-size:20px;font-weight:800;color:#0f1b3d">${ev.nome}</div>
              <div class="sub">${S.prod.nome} (${S.prod.cnpj}) · Local: ${loc.nome} · Data do Evento: ${ev.data}</div>
            </div>
            <div style="text-align:right">
              <div class="sub">Emitido em: ${new Date().toLocaleString('pt-BR')}</div>
              <div style="font-weight:800;color:#065f46;margin-top:4px">Ocupação: ${c.ingressosContados}/${c.capacidadeUsada} (${P(c.pctVendido)})</div>
            </div>
          </div>
          <div class="row"><span>Bilheteria Bruta (sem conveniência)</span><span class="num">${BRL(c.bil)}</span></div>
          <div class="row"><span>(−) Taxa Administrativa Disk (${fin.taxaAdm.percentual}%)</span><span class="num">${BRL(-c.taxaAdm)}</span></div>
          <div class="row"><span>(−) Taxa Operacional Negociada</span><span class="num">${BRL(-c.taxaOp)}</span></div>
          <div class="row" style="border-top:1px solid #dde2ee;font-weight:800;color:#0f1b3d"><span>(=) Borderô Líquido do Evento</span><span class="num">${BRL(c.bil - c.taxaAdm - c.taxaOp)}</span></div>
          <div class="row"><span>(−) Despesas Lançadas (Pago: ${BRL(c.despesasPagas)} / A pagar: ${BRL(c.despesasAPagar)})</span><span class="num">${BRL(-c.despesas)}</span></div>
          <div class="row"><span>(−) Retenções Provisionadas (ISS, ECAD, Locação e Outras)</span><span class="num">${BRL(-c.totRetencoes)}</span></div>
          <div class="row"><span>(−) Descontos Operacionais (Equipe/Estrutura)</span><span class="num">${BRL(-c.totOps)}</span></div>
          <div class="row" style="border-top:1px solid #dde2ee;font-weight:800;color:#0f1b3d"><span>(=) Resultado Líquido do Evento</span><span class="num">${BRL(c.resultado)}</span></div>
          <div class="row"><span>(=) Escolhido pelas Travas (${c.modo})</span><span class="num">${BRL(c.escolhido)}</span></div>
          <div class="row"><span>(+) Créditos Comerciais (Rebate + Patrocínio)</span><span class="num">${BRL(c.creditos)}</span></div>
          <div class="row"><span>(−) Já Repassado / Antecipações / Advanced</span><span class="num">${BRL(-(c.jaRepassado + c.advEv + c.antEv))}</span></div>
          <div class="row" style="border-top:2px solid #047857;padding-top:10px;font-size:16px;font-weight:800;color:#065f46">
            <span>(=) Saldo Liberável Atual do Evento</span><span class="num">${BRL(c.liberavel)}</span>
          </div>
          <div class="row"><span>Valor Retido pelas Travas (Liberação 100% em ${c.dataLiberacaoTotal} — D+${c.liberaTotalDmais} dias úteis)</span><span class="num">${BRL(c.retido)}</span></div>
          <div style="margin-top:24px;display:grid;grid-template-columns:1fr 1fr;gap:32px;padding-top:24px;border-top:1px dashed #c9cfdf;text-align:center;font-size:12px;color:#5a6584">
            <div>____________________________________________________<br/><strong>DiskIngressos · Departamento Financeiro</strong></div>
            <div>____________________________________________________<br/><strong>${S.prod.nome} (${S.prod.cnpj})</strong></div>
          </div>
        </div>
      `;
      document.getElementById('modal-memoria').classList.add('open');
    };

    window.abrirReciboRepassePDF = (repId) => {
      const rep = window.dbState.repasses[repId];
      if (!rep) return;
      const S = getFinanceCalculatedState();
      const cta = (window.dbState.contas[rep.produtoraId] || {})[rep.contaId] || {};
      const rateioObj = (rep.memoriaCalculo && (rep.memoriaCalculo.rateioAplicado || rep.memoriaCalculo.rateioEventos)) || {};
      document.getElementById('modal-memoria-body').innerHTML = `
        <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid #dde2ee">
          <span style="font-weight:800;color:#1e3a8a">🧾 Comprovante e Recibo de Repasse</span>
          <div style="display:flex;gap:8px">
            <button class="btn btn-primary btn-sm" onclick="window.print()">🖨️ Imprimir / Salvar PDF</button>
            <button class="btn btn-soft btn-sm" onclick="window.fecharModalMemoria()">Fechar</button>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:12px;font-size:13.5px">
          <div style="border-bottom:2px solid #1e3a8a;padding-bottom:12px;display:flex;justify-content:space-between">
            <div>
              <div style="font-size:11px;font-weight:800;color:#1e3a8a;text-transform:uppercase">DiskIngressos · Comprovante Oficial de Liquidação de Repasse</div>
              <div style="font-size:19px;font-weight:800;color:#0f1b3d">Recibo #${repId} (${rep.status})</div>
              <div class="sub">Favorecido: ${S.prod.nome} · CNPJ: ${S.prod.cnpj}</div>
            </div>
            <div style="text-align:right" class="sub">
              Solicitado: ${rep.solicitadoEm || '—'}<br/>
              Liquidado: ${rep.pagoEm || rep.decididoEm || '—'}
            </div>
          </div>
          <div class="row"><span>Conta Bancária de Destino</span><span class="num">${cta.banco || rep.contaId} · Ag ${cta.agencia || ''} CC ${cta.conta || ''}</span></div>
          <div class="row"><span>Modalidade / Protocolo Bancário</span><span class="num">${rep.forma} · ${rep.protocoloBancario || 'Sem protocolo'}</span></div>
          <div class="row"><span>Valor Bruto Abatido do Saldo</span><span class="num">${BRL(rep.valorSolicitado)}</span></div>
          <div class="row"><span>(−) Tarifa Bancária de Transferência (${rep.forma})</span><span class="num">${BRL(-(rep.tarifaTransferencia || 0))}</span></div>
          <div class="row" style="border-top:2px solid #047857;padding-top:8px;font-size:16px;font-weight:800;color:#065f46">
            <span>(=) Valor Líquido Creditado em Conta</span><span class="num">${BRL(rep.valorLiquido ?? rep.valorSolicitado)}</span>
          </div>
          <div style="background:#f4f6fb;padding:12px;border-radius:10px">
            <div style="font-weight:800;font-size:12px;margin-bottom:6px;text-transform:uppercase;color:#3d4766">Rateio por Evento (${rep.modoRateio || 'proporcional'})</div>
            ${Object.entries(rateioObj).map(([eid, val]) => `
              <div class="row"><span>${S.evMap[eid]?.ev.nome || eid}</span><span class="num">${BRL(val)}</span></div>
            `).join('')}
          </div>
        </div>
      `;
      document.getElementById('modal-memoria').classList.add('open');
    };

    window.abrirModalMemoria = (repId) => {
      const rep = window.dbState.repasses[repId];
      if (!rep || !rep.memoriaCalculo) return;
      document.getElementById('modal-memoria-body').innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <h2 class="h2">Memória de Cálculo Auditável · ${repId}</h2>
          <button class="btn btn-soft btn-sm" onclick="window.fecharModalMemoria()">Fechar</button>
        </div>
        <pre class="num" style="background:#f4f6fb;padding:14px;border-radius:10px;font-size:12px;overflow-x:auto">${JSON.stringify(rep.memoriaCalculo, null, 2)}</pre>
      `;
      document.getElementById('modal-memoria').classList.add('open');
    };
    window.fecharModalMemoria = () => document.getElementById('modal-memoria').classList.remove('open');

    window.restaurarSeed = () => {
      localStorage.removeItem(STORAGE_KEY);
      window.dbState = loadDB();
      saveDB();
      window.render();
    };

    // Tooltip listener
    document.addEventListener('mouseover', e => {
      const el = e.target.closest('[data-tip]');
      const tip = document.getElementById('chart-tip');
      if (el && tip) { tip.textContent = el.getAttribute('data-tip'); tip.style.display = 'block'; }
    });
    document.addEventListener('mousemove', e => {
      const tip = document.getElementById('chart-tip');
      if (tip && tip.style.display === 'block') {
        tip.style.left = Math.min(window.innerWidth - 260, e.clientX + 12) + 'px';
        tip.style.top = Math.max(10, e.clientY - 36) + 'px';
      }
    });
    document.addEventListener('mouseout', e => {
      if (e.target.closest('[data-tip]')) document.getElementById('chart-tip').style.display = 'none';
    });

    window.render();
  </script>
</body>
</html>
